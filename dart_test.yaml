# Dart/Flutter test runner configuration.
#
# The `golden` tag marks tests that render widgets to PNG and compare them
# against committed reference images. Golden output is sensitive to the
# host's font rasterization, so those tests are run locally on the
# reference platform and excluded from cloud CI (Codemagic) via
# `flutter test --exclude-tags golden`.
tags:
  golden:
    description: "Golden image tests — platform-sensitive rendering; excluded from CI."
  visual:
    description: >-
      The operator render harness: every operator area at six widths through
      its real repository, failing on any exception or overflow. It keeps no
      reference images (founder, 2026-10-26) and runs with the ordinary suite;
      Codemagic's iOS TestFlight lane skips it (text metrics differ there).
      To look at the pictures:
        OPERATOR_SHOTS=build/operator_shots flutter test test/admin/operator_render_harness_test.dart
