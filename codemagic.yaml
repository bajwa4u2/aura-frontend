# Codemagic CI/CD — Aura iOS TestFlight pipeline
# =============================================================================
# Builds a signed release IPA for the Aura iOS app and uploads it to
# TestFlight. Signing is handled entirely through the App Store Connect API
# key integration — there are NO Apple ID / password credentials in this
# file, and no .p8 / .mobileprovision / .cer files are committed to the repo.
#
# ── One-time setup in the Codemagic UI (not in this file) ────────────────────
#   1. Teams → Integrations → App Store Connect: connect the API key.
#      The integration NAME must match `integrations.app_store_connect`
#      below EXACTLY (currently "Aura Platform LLC"). If your integration
#      is named differently, change the value below to match it.
#   2. App settings → Environment variables: add a SECURE variable
#      FIREBASE_IOS_CONFIG_BASE64
#      = base64 of ios/Runner/GoogleService-Info.plist
#        (macOS/Linux:  base64 -i GoogleService-Info.plist | pbcopy)
#      This file is gitignored on purpose (see FIREBASE_SETUP.md) and is
#      injected at build time by the "Provision Firebase iOS config" step.
#
# ── Apple Developer portal prerequisites (see docs/IOS_TESTFLIGHT_HANDOFF.md)
#   • Explicit App ID `org.auraplatform.app` registered.
#   • Capabilities enabled on that App ID: Push Notifications,
#     Associated Domains (both are declared in Runner.entitlements).
#   • App Store Connect app record created for `org.auraplatform.app`.
#   Codemagic auto-creates the Apple Distribution certificate and the
#   App Store provisioning profile from the API key; it cannot enable
#   App ID capabilities, so those must exist before the first build.
# =============================================================================

workflows:
  ios-testflight:
    name: Aura iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    # App Store Connect API key integration. MUST match the integration
    # name configured in the Codemagic UI character-for-character.
    integrations:
      app_store_connect: Aura Platform LLC
    environment:
      ios_signing:
        # Codemagic fetches/creates the Apple Distribution certificate and
        # an App Store provisioning profile for this bundle id using the
        # App Store Connect API key above (automatic managed signing).
        distribution_type: app_store
        bundle_identifier: org.auraplatform.app
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # FIREBASE_IOS_CONFIG_BASE64 lives in this UI-defined group. A group
        # must be listed here to actually be injected into the build — Codemagic
        # does not inject grouped variables automatically just because they
        # exist in the UI.
        - firebase_ios
      vars:
        BUNDLE_ID: "org.auraplatform.app"
        # FIREBASE_IOS_CONFIG_BASE64 is added as a SECURE variable in the
        # Codemagic UI (group: firebase_ios) — never define its value here.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Provision Firebase iOS config (FCM → APNs)
        script: |
          set -e
          if [ -n "$FIREBASE_IOS_CONFIG_BASE64" ]; then
            echo "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode \
              > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist provisioned for build."
          else
            echo "WARNING: FIREBASE_IOS_CONFIG_BASE64 is not set."
            echo "The build will still produce a signed IPA, but iOS push"
            echo "notifications (FCM) will not function until the plist is"
            echo "provided. See FIREBASE_SETUP.md."
          fi
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        # Golden tests are excluded from CI: their reference PNGs are
        # rendering-platform specific and are validated locally instead.
        script: flutter test --exclude-tags golden
      - name: Set up code signing
        # Writes the fetched profiles into the Xcode project and generates
        # /Users/builder/export_options.plist for `flutter build ipa`.
        script: xcode-project use-profiles
      - name: Build signed IPA
        # Build name / number come from pubspec.yaml `version:` (currently 1.3.0+24).
        # For repeat uploads either bump pubspec.yaml or switch to
        # auto-increment, e.g.:
        #   --build-number=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/logs/*.log
    publishing:
      app_store_connect:
        # `integration` reuses the App Store Connect API key above —
        # no Apple ID or app-specific password is used.
        auth: integration
        submit_to_testflight: true

  # ===========================================================================
  # AURA iOS — CERTIFICATION
  # ===========================================================================
  # Runs Aura's integration_test suites on a real macOS host against an iOS
  # runtime, and preserves the evidence.
  #
  # ── WHY THIS EXISTS ────────────────────────────────────────────────────────
  # Chapter after chapter closed with `IOS = PENDING_MACOS_HOST`, which was
  # literal: the development machine is windows-arm64 and cannot build, boot or
  # exercise anything iOS. Codemagic already IS a macOS host — it has produced
  # 16 signed builds — so the boundary was never "no Mac", it was "no Mac
  # workflow that runs the certification suites".
  #
  # ── WHAT THIS PROVES, AND WHAT IT DOES NOT ─────────────────────────────────
  # This runs on the iOS SIMULATOR. That certifies everything that is a
  # property of the app on iOS — layout, navigation, touch targets, copy,
  # platform interaction profile, lifecycle — and it certifies NONE of what is
  # a property of the hardware: camera, microphone, Bluetooth audio, real
  # network transitions, push delivery.
  #
  # Simulator results are reported as SIMULATOR_CERTIFIED. They are not
  # RELEASE_CERTIFIED and must never be reported as physical-device evidence.
  # Physical iPhone coverage needs AWS Device Farm or the founder's own device;
  # see docs/2026-08-27-ios-certification-lane.md.
  #
  # ── NO SIGNING ─────────────────────────────────────────────────────────────
  # Deliberately no `ios_signing` block and no App Store Connect integration.
  # A simulator build is not signed, so this workflow needs no Apple credential
  # of any kind. The signing authority stays where it belongs — in the
  # TestFlight workflow above — and is not duplicated to reach a test runner.
  ios-certification:
    name: Aura iOS — Certification (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Boot an iPhone simulator, and record WHICH one
        script: |
          set -euo pipefail
          xcrun simctl shutdown all || true

          # The newest available iPhone runtime, chosen at run time rather than
          # pinned: a pinned runtime silently stops existing when Codemagic
          # updates Xcode, and the failure looks like a test failure.
          RUNTIME=$(xcrun simctl list runtimes --json \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and 'iOS' in x['name']]; print(sorted(r, key=lambda x: x['version'])[-1]['identifier'])")
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json \
            | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if x['productFamily']=='iPhone']; print(d[-1]['identifier'])")

          UDID=$(xcrun simctl create "aura-cert" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          mkdir -p certification
          {
            echo "AURA iOS CERTIFICATION RUN"
            echo "build_commit=${CM_COMMIT:-unknown}"
            echo "build_number=${BUILD_NUMBER:-unknown}"
            echo "branch=${CM_BRANCH:-unknown}"
            echo "runtime=$RUNTIME"
            echo "device_type=$DEVICE_TYPE"
            echo "simulator_udid=$UDID"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "flutter=$(flutter --version | head -1)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee certification/run-manifest.txt

          echo "$UDID" > /tmp/aura_sim_udid

      - name: Certify — Preferences
        script: |
          set -euo pipefail
          UDID=$(cat /tmp/aura_sim_udid)
          flutter test integration_test/preferences_certification_test.dart \
            -d "$UDID" --reporter expanded 2>&1 \
            | tee certification/preferences.log

      - name: Certify — Media and Trace
        script: |
          set -euo pipefail
          UDID=$(cat /tmp/aura_sim_udid)
          flutter test integration_test/media_certification_test.dart \
            -d "$UDID" --reporter expanded 2>&1 \
            | tee certification/media.log
          flutter test integration_test/trace_lifecycle_test.dart \
            -d "$UDID" --reporter expanded 2>&1 \
            | tee certification/trace.log

      - name: Seal the run manifest
        script: |
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> certification/run-manifest.txt
          cat certification/run-manifest.txt
    artifacts:
      - certification/*
